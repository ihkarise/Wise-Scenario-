name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**", "fix/**", "docs/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Migrations, RLS and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # ubuntu-latest ships PostgreSQL server binaries; each script starts and removes a throwaway instance.
      - name: Approved migrations, rollback and RLS tests
        run: bash scripts/verify-db.sh
      - name: Proposed (Case Builder) migration tests
        run: bash scripts/verify-db.sh --proposed
      - name: Repository integration tests
        run: npm run test:integration
